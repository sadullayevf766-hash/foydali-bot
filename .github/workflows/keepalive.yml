# ZAXIRA uyg'otgich.
#
# Asosiy mexanizm — xizmatning O'ZINI o'zi ping qilishi (run_all._self_ping).
# Bu ish faqat xizmat baribir uxlab qolgan holat uchun: masalan deploy
# oralig'ida yoki jarayon qulagan bo'lsa.
#
# Nega asosiy emas: `*/10` yozilgan bo'lsa ham GitHub bepul runnerlarda
# rejalashtirilgan ishlarni kuchli sekinlashtiradi — 2026-09-06 da
# o'lchandi, amalda ~2 soatda bir marta ishga tushdi. Render esa 15
# daqiqada uxlaydi, ya'ni buning o'zi yetarli emas.
name: keepalive

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Xizmatni uyg'otish
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 \
              "${{ vars.KEEPALIVE_URL || 'https://foydali-bot-6dza.onrender.com/' }}")
            echo "urinish $i -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "Xizmat javob bermadi"
          exit 1
